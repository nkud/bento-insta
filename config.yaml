# ===== お弁当 Instagram 自動投稿 設定 =====
# 秘密情報（トークン等）はここに書かず、GitHub の Secrets に入れてください。

drive:
  # 写真を入れる Google Drive フォルダの ID（URL の folders/ の後ろ）。
  # Secrets の DRIVE_FOLDER_ID があればそちらが優先されます。
  folder_id: ""

posting:
  # 写真は「下書き」Issue になり、コメント（/post など）で承認したものだけ投稿されます。
  max_drafts_per_run: 10        # 1回の実行で作る下書きの最大数
  max_retries: 3                # 下書き作成に失敗した写真を何回まで再挑戦するか

claude:
  model: claude-sonnet-5-5

instagram:
  graph_version: v26.0
  # 統合ログインのシステムユーザートークン（EAA...、期限なし）→ graph.facebook.com
  # Instagram ログインのトークン（IGAA...、60日）→ graph.instagram.com
  host: graph.facebook.com

image:
  width: 1080
  height: 1350                  # 4:5（フィードで一番大きく表示される縦長）
  jpeg_quality: 92
  show_notes: false             # 2枚目のおかず名の下に（補足）を書くか
  uniform_ink: true             # 2枚目の文字色を全部白にそろえる（false で明るい所は焦げ茶）
  memo_slide: false             # 3枚目に「作り置きメモ」を付ける（true で有効）
  dslr:                         # 美味しそう＋背景ボケ（一眼レフ風）。料理は描き換えない
    enabled: true
    food_pop: 1.0                 # 美味しそう加工の強さ（0 で無し）
    bokeh: true                   # 弁当箱の外をレンズのボケでぼかす
    bokeh_radius: 0.022           # ボケの大きさ（短辺に対する比）
    vignette: 0.22                # 周辺減光
    grain: 0.012                  # 粒子感
  color:                        # 1枚目の色補正（料理の形は変えない）
    enabled: true
    white_balance: 0.5          # 色かぶりを戻す強さ（0〜1）
    warmth: 0.03                # 暖かみ
    saturation: 1.12            # 鮮やかさ
    contrast: 1.04
    sharpen: 55

caption:
  # アカウント: @zaidan_bento（在宅だんな弁当）
  base_hashtags: ["#在宅だんな弁当", "#わっぱ弁当"]   # Instagram は1投稿5個まで（2025年12月〜）
  # 自分らしい口調のヒント（自由に書き換えてOK）
  voice: >-
    週5フルリモートで家で働く旦那に、妻がお弁当を作って渡している設定。
    妻の目線で、やさしく少しくだけた口調。旦那へのひとこと（例:「今日も在宅おつかれさま」）を
    ときどき自然に入れる。作り置きの活用やわっぱへの詰め方の工夫に触れてもよい。絵文字は1〜2個まで。
  signature: ""                 # 毎回最後に付けたい一言（空なら無し）

# どの「上げ方」が伸びるかを試すための実験軸。
# 各投稿でどれかが選ばれ、結果のいいね数などで勝ちパターンを学習します。
experiment:
  epsilon: 0.3                  # 30% は新しいパターンを試し、70% は勝ちパターンを使う
  min_samples_per_arm: 3        # 各パターン最低この回数は試してから判断
  dimensions:
    title_style: [kakko, plain, date]       # ＼ 〇〇弁当 ／ / 〇〇弁当 / 11.21 〇〇弁当
    pen: [marker, thin]                     # 手書き文字のペンの太さ（マーカー / 細ペン）
    caption_length: [short, long]           # コメントの長さ
    hashtag_count: [3, 5]                   # ハッシュタグの数（上限5）

analysis:
  mature_hours: 72              # 投稿からこの時間が経った投稿だけで評価する
  min_posts_for_learning: 8     # これ未満ならレポートは出すが、方針は変えない
