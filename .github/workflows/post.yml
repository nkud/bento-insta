name: お弁当を投稿

on:
  schedule:
    - cron: "*/30 * * * *"        # 30分ごとに Drive をチェック（投稿時間帯は config.yaml で制御）
  workflow_dispatch:
    inputs:
      force:
        description: "時間帯・間隔の制限を無視して今すぐ投稿"
        type: boolean
        default: false
      dry_run:
        description: "投稿せずに画像とキャプションだけ作る（Artifacts で確認）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bento-state            # 投稿・集計が同時に data/ を書き換えないように
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 新しい写真を投稿
        run: python src/post.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: ドライランの結果を保存
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v5
        with:
          name: dry-run-output
          path: out/

      - name: 投稿記録をコミット
        if: always()
        run: |
          git config user.name "bento-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "post: 投稿記録を更新"
            git pull --rebase && git push
          fi
