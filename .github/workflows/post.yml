name: お弁当の下書きを作成・予約投稿

on:
  schedule:
    - cron: "17 * * * *"          # 予備：1時間ごと（ふだんは Apps Script が5分ごとに起動する）
  workflow_dispatch:
  push:                           # 仕組みを更新したときにも一度動かす（未対応コメントの見直しを含む）
    branches: [main]
    paths: ["src/**", "config.yaml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: bento-state            # 投稿・承認・集計が同時に data/ を書き換えないように
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # イベント発生時点ではなく、実行時点の最新の記録を使う
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Claude Code CLI（サブスク枠で Claude を使う）
        run: npm install -g @anthropic-ai/claude-code

      - name: 予約投稿と下書き作成
        run: python src/post.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}

      - name: 記録をコミット
        if: always()
        run: |
          git config user.name "bento-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ 2>/dev/null || git add data/
          if ! git diff --cached --quiet; then
            git commit -m "post: 記録を更新"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi
