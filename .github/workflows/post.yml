name: お弁当の下書きを作成・予約投稿

on:
  schedule:
    - cron: "*/15 * * * *"        # 15分ごと：予約時刻を過ぎた下書きの投稿 ＋ Drive の新しい写真から下書き作成
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bento-state            # 投稿・承認・集計が同時に data/ を書き換えないように
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 予約投稿と下書き作成
        run: python src/post.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}

      - name: 記録をコミット
        if: always()
        run: |
          git config user.name "bento-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ 2>/dev/null || git add data/
          if ! git diff --cached --quiet; then
            git commit -m "post: 記録を更新"
            git pull --rebase && git push
          fi
