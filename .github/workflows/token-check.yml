name: トークンの種類と権限を確認
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          T: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          t = os.environ["T"]
          print("prefix:", t[:4], "len:", len(t))
          def get(path):
              u = f"https://graph.facebook.com/v26.0/{path}{'&' if '?' in path else '?'}access_token={t}"
              try:
                  return json.load(urllib.request.urlopen(u))
              except urllib.error.HTTPError as e:
                  return {"error": json.loads(e.read().decode()).get("error", {}).get("message")}
          print("debug:", json.dumps(get(f"debug_token?input_token={t}").get("data") or get(f"debug_token?input_token={t}"), ensure_ascii=False)[:800])
          print("me:", get("me?fields=id,name"))
          print("perms:", get("me/permissions"))
          PY
