name: 下書きを承認・修正

# 下書き Issue に /post /redo /skip とコメントすると動く。
# 公開リポジトリなので、持ち主とコラボレーター（Settings → Collaborators で招待した人）のコメントだけを受け付ける。

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: bento-state
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.issue.labels.*.name, '下書き') ||
       contains(github.event.issue.labels.*.name, '予約済み'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 受け付けたことを知らせる（👀）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes || true

      - uses: actions/checkout@v5
        with:
          ref: main            # イベント発生時点ではなく、実行時点の最新の記録を使う
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Claude Code CLI（サブスク枠で Claude を使う）
        run: npm install -g @anthropic-ai/claude-code

      - name: コメントのコマンドを実行
        run: python src/approve.py
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}

      - name: 記録をコミット
        if: always()
        run: |
          git config user.name "bento-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ 2>/dev/null || git add data/
          if ! git diff --cached --quiet; then
            git commit -m "approve: 記録を更新"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi
