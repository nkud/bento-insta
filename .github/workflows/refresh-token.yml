name: Instagram トークン更新

# 長期トークンは60日で切れるので、毎月更新して Secrets を書き換える。
# Secrets に GH_PAT（このリポジトリの Secrets を書ける Fine-grained PAT）が必要。

on:
  schedule:
    - cron: "41 0 1,15 * *"       # 毎月1日・15日 9:41 JST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: トークンを更新して保存
        env:
          OLD: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${OLD}" | jq -r .access_token)
          if [ -z "$NEW" ] || [ "$NEW" = "null" ]; then
            echo "::error::トークン更新に失敗しました。期限切れの場合は README の手順で作り直してください"; exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
          echo "更新しました"
